<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제휴 문의</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">Partnership</p>
      <h1>제휴 문의</h1>
      <p class="intro">
        브랜드 협업, 콘텐츠 제휴, 기술 협력 문의를 남겨주세요.
        검토 후 입력해주신 이메일로 회신드립니다.
      </p>
    </section>

    <section class="card">
      <form
        id="partnership-form"
        class="contact-form"
        action="https://formspree.io/f/mkopqewy"
        method="POST"
      >
        <input type="hidden" name="_subject" value="새 제휴 문의가 도착했습니다" />
        <input type="hidden" name="_language" value="ko" />
        <input type="hidden" name="_replyto" value="" />

        <label class="honeypot" aria-hidden="true" tabindex="-1">
          <span>웹사이트</span>
          <input type="text" name="_gotcha" autocomplete="off" tabindex="-1" />
        </label>

        <label>
          <span>회사명 또는 브랜드명</span>
          <input type="text" name="company" placeholder="예: CYH Studio" autocomplete="organization" required />
        </label>

        <label>
          <span>담당자 이름</span>
          <input type="text" name="name" placeholder="이름을 입력해주세요" autocomplete="name" required />
        </label>

        <label>
          <span>이메일</span>
          <input type="email" name="email" placeholder="name@company.com" autocomplete="email" required />
        </label>

        <label>
          <span>연락처</span>
          <input type="tel" name="phone" placeholder="선택 입력" autocomplete="tel" />
        </label>

        <label>
          <span>문의 유형</span>
          <select name="inquiry_type" required>
            <option value="">선택해주세요</option>
            <option value="brand-collaboration">브랜드 협업</option>
            <option value="business-partnership">사업 제휴</option>
            <option value="media-content">미디어·콘텐츠</option>
            <option value="other">기타</option>
          </select>
        </label>

        <label>
          <span>문의 내용</span>
          <textarea
            name="message"
            rows="6"
            placeholder="제휴 목적, 기대 효과, 일정 등을 간단히 적어주세요"
            required
          ></textarea>
        </label>

        <button type="submit">문의 보내기</button>
        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script defer src="/main.js"></script>
</body>
</html>
